name: Deploy web output to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-zh/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Deploy the committed web output; web/ is ignored and only exists locally.
      - name: Upload web output
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-zh

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
